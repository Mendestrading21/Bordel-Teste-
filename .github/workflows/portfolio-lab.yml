name: PortfolioLab

on:
  push:
    branches: [main]
    paths:
      - "projects/portfolio-lab/**"
      - ".github/workflows/portfolio-lab.yml"
  pull_request:
    paths:
      - "projects/portfolio-lab/**"
      - ".github/workflows/portfolio-lab.yml"

# Une seule exécution par branche : un push qui suit annule la précédente.
concurrency:
  group: portfolio-lab-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/portfolio-lab

env:
  # Aucun test de la CI n'appelle une API fournisseur payante.
  MARKET_DATA_PROVIDER: mock
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # PostgreSQL réel : les politiques RLS ne peuvent être vérifiées que par le
    # moteur qui les applique. Une simulation ne prouverait rien.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: portfolio_lab_ci
          POSTGRES_DB: portfolio_lab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: projects/portfolio-lab/pnpm-lock.yaml

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Vérifier le formatage
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests unitaires
        run: pnpm run test:unit

      - name: Installer le client psql
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y postgresql-client

      - name: Tests d'intégration
        env:
          # Mot de passe d'un conteneur éphémère de CI, détruit à la fin du job.
          # Il ne donne accès à rien d'autre et n'est pas un secret.
          DATABASE_URL_TEST: postgresql://postgres:portfolio_lab_ci@localhost:5432/portfolio_lab_test
        run: pnpm run test:integration

      - name: Build de production
        run: pnpm run build

      - name: Exécuter la matrice de couverture
        # La matrice est une **observation**, pas une source.
        #
        # Elle était auparavant comparée au rapport versionné par
        # `git diff --exit-code`, ce qui revenait à affirmer qu'une observation
        # ne change jamais. C'est faux : le résultat dépend de l'accès réseau,
        # des clés présentes et de ce que les fournisseurs répondent ce jour-là.
        # Le contrôle échouait donc dès que l'environnement d'exécution différait
        # de celui qui avait produit le fichier — un rouge qui ne dit rien de la
        # qualité du code.
        #
        # Ce qui est vérifié ici est ce qui doit rester vrai : la matrice
        # s'exécute jusqu'au bout. Son résultat est publié en artéfact, où il
        # est daté et attribuable à un environnement précis.
        run: pnpm run coverage:matrix

      - name: Publier la matrice observée
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-matrix
          path: projects/portfolio-lab/docs/market-data/
          retention-days: 30


  e2e:
    name: Parcours E2E mobile et desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Les parcours avec données ont besoin d'un portefeuille peuplé, donc du
    # seed et d'une vraie base.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: portfolio_lab_ci
          POSTGRES_DB: portfolio_lab_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:portfolio_lab_ci@localhost:5432/portfolio_lab_demo

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: projects/portfolio-lab/pnpm-lock.yaml

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Installer Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build de production
        run: pnpm run build

      - name: Installer le client psql
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y postgresql-client

      - name: Préparer la base de démonstration
        # Toutes les migrations, dans l'ordre, jamais une liste énumérée : une
        # liste figée fait silencieusement oublier chaque nouvelle migration, et
        # le seed échoue alors sur une table absente.
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "→ $migration"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$migration"
          done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/seed.sql

      - name: Tests E2E — application sans données
        # Build de production : c'est là que le service worker, les en-têtes de
        # sécurité et le manifeste se comportent réellement.
        run: pnpm run test:e2e

      - name: Tests E2E — parcours avec portefeuille peuplé
        # Le mode démonstration est refusé en production ; ces parcours tournent
        # donc sur le serveur de développement.
        env:
          PORTFOLIO_LAB_DEMO_MODE: "true"
        run: pnpm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: projects/portfolio-lab/playwright-report/
          retention-days: 7

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: projects/portfolio-lab/pnpm-lock.yaml

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # `moderate` et non `high` : les avis modérés touchant une dépendance de
      # build sont exactement ceux qu'on cesse de regarder si on ne les fait pas
      # échouer. Une exception assumée doit passer par `pnpm.overrides`, où elle
      # est visible dans le diff.
      - name: Auditer les dépendances
        run: pnpm audit --audit-level moderate

  secrets:
    name: Scan de secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : gitleaks analyse aussi les commits, pas
          # seulement l'arbre de travail.
          fetch-depth: 0

      - name: Installer gitleaks
        run: |
          set -euo pipefail
          version=8.24.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scanner l'historique et l'arbre de travail
        # `--redact` empêche qu'un secret détecté soit recopié en clair dans
        # les logs publics de la CI.
        run: gitleaks detect --no-banner --redact --exit-code 1

      - name: Vérifier qu'aucun fichier .env réel n'est versionné
        run: |
          set -euo pipefail
          tracked=$(git ls-files '*.env' '.env' '.env.*' | grep -v '\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "Fichiers .env versionnés interdits :"
            echo "$tracked"
            exit 1
          fi
          echo "Aucun fichier .env réel versionné."
